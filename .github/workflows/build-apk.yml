name: build-apk
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android project files are generated here; only lib/ and pubspec.yaml are committed.
      - name: Generate Android scaffolding
        run: |
          cp -r lib /tmp/lib_src && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com.myschool --project-name myschool_app .
          rm -rf lib test analysis_options.yaml
          cp -r /tmp/lib_src lib && cp /tmp/pubspec.yaml pubspec.yaml

      - name: Internet permission and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="MySchool"|' $M

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: myschool-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
